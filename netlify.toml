# Build settings live in the repo so deploy previews and production build
# exactly like a local `npm run build`.
[build]
  # Unit tests run first, so a failing test stops the deploy.
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+; Netlify's old default (18) can't run it.
  NODE_VERSION = "22"

# Vite puts a content hash in every file name under /assets, so a changed file
# gets a new URL and browsers can keep these for a year without revalidating.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The site lives at manuelmaxera.com. Send the old Netlify address there
# permanently, so search engines see one copy and Umami (which only counts
# manuelmaxera.com) sees every visit. Deploy previews use other hosts
# (deploy-preview-N--manuel-maxera.netlify.app) and are not affected.
[[redirects]]
  from = "https://manuel-maxera.netlify.app/*"
  to = "https://manuelmaxera.com/:splat"
  status = 301
  force = true
