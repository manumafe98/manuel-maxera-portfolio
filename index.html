<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Root-absolute, so deep unknown URLs (served the 404 page) find them. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1f1e1d" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--app-head-->
    <!-- Picks the shell before any stylesheet loads, so the pre-rendered
         HTML never shows the wrong one (ADR-0002). -->
    <style>
      .desktop-shell {
        display: none;
      }
      @media (min-width: 1024px) {
        .desktop-shell {
          display: block;
        }
        .phone-shell {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!--app-noscript-->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
